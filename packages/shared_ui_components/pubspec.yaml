name: yeedoy_shared_ui_components
description: Shared Flutter UI components for Yeedoy apps.
version: 0.0.1
publish_to: none
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  yeedoy_shared_models:
    path: ../shared_models

flutter:
  assets:
    - assets/brand/yeedoy-icon.svg
    - assets/brand/yeedoy-mark-transparent.svg
    - assets/brand/yeedoy-splash-logo.svg
    - assets/brand/yeedoy-wordmark.svg
    - assets/brand/yeedoy-wordmark-dark.svg
    - assets/brand/yeedoy-wordmark-red.svg
    - assets/brand/yeedoy-wordmark-white.svg
    - assets/brand/yeedoy-icon.png
    - assets/brand/yeedoy-mark-transparent.png
    - assets/brand/yeedoy-splash-logo.png
    - assets/brand/yeedoy-wordmark.png
