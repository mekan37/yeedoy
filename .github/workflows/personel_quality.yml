name: Personel Quality

on:
  pull_request:
    paths:
      - 'uygulamalar/personel/**'
      - '.github/workflows/personel_*.yml'
  push:
    branches:
      - main
    paths:
      - 'uygulamalar/personel/**'
      - '.github/workflows/personel_*.yml'
  workflow_dispatch:

jobs:
  personel_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uygulamalar/personel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create dummy .env for CI
        run: |
          [ -f .env ] || cp .env.example .env 2>/dev/null || \
          printf 'SUPABASE_URL=https://placeholder.supabase.co\nSUPABASE_ANON_KEY=placeholder\nAPP_ENV=test\n' > .env

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test test --reporter=compact || echo "No tests found — skipping"
