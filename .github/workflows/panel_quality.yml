name: Panel Quality

on:
  pull_request:
    paths:
      - 'apps/panel_flutter_web/**'
      - 'packages/ui_tokens/**'
      - '.github/workflows/panel_quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/panel_flutter_web/**'
      - 'packages/ui_tokens/**'
      - '.github/workflows/panel_quality.yml'
  workflow_dispatch:
    inputs:
      run_playwright_smoke:
        description: 'Run Playwright smoke'
        required: false
        type: boolean
        default: false

jobs:
  panel_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/panel_flutter_web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test test

      - name: API version gate
        run: dart tool/api_version_gate_check.dart

      - name: Security review gate
        run: dart tool/security_review_check.dart --strict

      - name: Build owner web
        run: flutter build web --release --dart-define=DEV_TOOLS_ENABLED=false --target lib/main_web_owner.dart

      - name: Build admin web
        run: flutter build web --release --dart-define=DEV_TOOLS_ENABLED=false --target lib/main_web_admin.dart

  panel_playwright_smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_playwright_smoke == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/panel_flutter_web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web_next/package-lock.json

      - name: Install Playwright toolchain
        working-directory: apps/web_next
        run: npm ci

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install Chromium
        run: node ../web_next/node_modules/playwright/cli.js install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:smoke
