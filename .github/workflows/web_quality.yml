name: Web Quality

on:
  pull_request:
    paths:
      - 'apps/web_next/**'
      - 'packages/ui_tokens/**'
      - '.github/workflows/web_quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web_next/**'
      - 'packages/ui_tokens/**'
      - '.github/workflows/web_quality.yml'
  workflow_dispatch:

jobs:
  web_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web_next
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web_next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: RLS coverage check
        # Fails if any public table has no RLS policies — zero rows expected
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        if: env.SUPABASE_DB_URL != ''
        run: |
          RESULT=$(psql "$SUPABASE_DB_URL" -tAc "
            SELECT tablename FROM pg_tables
            WHERE schemaname = 'public'
              AND tablename NOT IN (
                SELECT DISTINCT tablename FROM pg_policies
                WHERE schemaname = 'public'
              );
          ")
          if [ -n "$RESULT" ]; then
            echo "FAIL: Tables without RLS policies: $RESULT"
            exit 1
          fi
          echo "OK: All public tables have RLS policies."
