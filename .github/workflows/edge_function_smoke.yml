name: Edge Function Smoke

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge_function_smoke.yml'
  workflow_dispatch:

jobs:
  edge_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ~2.x

      - name: Deno type check
        run: deno check $(find supabase/functions -name "index.ts" | tr '\n' ' ')

      - name: Import map validation
        run: deno info supabase/functions/import_places_json/index.ts --quiet || true

      - name: Auth check
        continue-on-error: true
        run: |
          MISSING=""
          for f in supabase/functions/*/index.ts; do
            FNAME=$(basename $(dirname $f))
            # skip known-public functions
            if [[ "$FNAME" == "get-exchange-rates" || "$FNAME" == "verify-domain" ]]; then
              continue
            fi
            if ! grep -q "Authorization\|PURGE_CRON_SECRET\|EXCHANGE_CRON_SECRET" "$f"; then
              MISSING="$MISSING $FNAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "WARN: Functions possibly missing auth check:$MISSING"
          else
            echo "OK: All checked functions have auth patterns"
          fi
