name: Packages Quality

on:
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/packages_quality.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.github/workflows/packages_quality.yml'
  workflow_dispatch:

jobs:
  packages_analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared_models, shared_ui_components]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check if Flutter package
        id: check
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "is_flutter=true" >> $GITHUB_OUTPUT
          else
            echo "is_flutter=false" >> $GITHUB_OUTPUT
          fi
        working-directory: packages/${{ matrix.package }}

      - name: Flutter pub get
        if: steps.check.outputs.is_flutter == 'true'
        run: flutter pub get
        working-directory: packages/${{ matrix.package }}

      - name: Flutter analyze
        if: steps.check.outputs.is_flutter == 'true'
        run: flutter analyze
        working-directory: packages/${{ matrix.package }}
