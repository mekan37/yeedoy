name: yeedoy
description: "Yeedoy owner/admin web panel project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.2.0
  go_router: ^17.0.1
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4
  flutter_screenutil: ^5.9.0
  supabase_flutter: ^2.12.0
  share_plus: ^12.0.1
  pdf: ^3.11.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0
  youtube_player_iframe: ^5.2.1
  file_picker: ^10.3.2
  font_awesome_flutter: ^10.8.0
  intl: ^0.20.2
  html: ^0.15.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  generate: true

  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-SemiBold.ttf
        - asset: assets/fonts/Sora-Bold.ttf
  assets:
    - .env
    - assets/images/
    - assets/json/karaliste.txt
    - assets/json/yemek.v4.json




