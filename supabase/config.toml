project_id = "yeedoy"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323
enabled = true

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

# [[storage.buckets]] sections are managed via SQL migrations.
# CLI v2.98.x does not support the [[storage.buckets]] TOML syntax.
# Buckets are created/updated by supabase/migrations/20260609000005_fix_storage_policies.sql

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:54321"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.import_places_json]
enabled = true
verify_jwt = true
import_map = "./functions/import_places_json/deno.json"
entrypoint = "./functions/import_places_json/index.ts"

[functions.purge-temp-uploads]
enabled = true
verify_jwt = true
entrypoint = "./functions/purge-temp-uploads/index.ts"

[functions.ai-menu-analyze]
enabled = true
verify_jwt = true
entrypoint = "./functions/ai-menu-analyze/index.ts"

[functions.ai-menu-image-gen]
enabled = true
verify_jwt = true
entrypoint = "./functions/ai-menu-image-gen/index.ts"

[functions.ai-nutrition-estimate]
enabled = true
verify_jwt = true
entrypoint = "./functions/ai-nutrition-estimate/index.ts"

[functions.ai-allergen-detect]
enabled = true
verify_jwt = true
entrypoint = "./functions/ai-allergen-detect/index.ts"

[functions.ai-ingredient-detect]
enabled = true
verify_jwt = true
entrypoint = "./functions/ai-ingredient-detect/index.ts"

[functions.get-exchange-rates]
enabled = true
verify_jwt = false
entrypoint = "./functions/get-exchange-rates/index.ts"
