name: yeedoy_personel
description: "Yeedoy İşletme — Owner ve garson operasyon uygulaması."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Paylaşımlı paketler
  yeedoy_shared_ui_components:
    path: ../../packages/shared_ui_components

  # State + routing
  flutter_riverpod: ^3.2.0
  go_router: ^17.0.1

  # Backend + storage
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.4
  flutter_dotenv: ^6.0.0

  # Firebase (bildirim + analytics)
  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.2
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7

  # QR kod
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # UI yardımcıları
  intl: ^0.20.2
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  vibration: ^2.0.0
  local_auth: ^2.3.0
  postgrest: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#1A1D2B"
  adaptive_icon_foreground: "assets/brand/icon-fg.png"

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/Sora-Regular.ttf
        - asset: assets/Sora-SemiBold.ttf
        - asset: assets/Sora-Bold.ttf
  assets:
    - .env
    - assets/brand/
